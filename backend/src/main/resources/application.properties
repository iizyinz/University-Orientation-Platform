spring.application.name=freshman-service

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/freshman_service?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.backend.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Server
server.port=8080

# S3 Config
# 密钥不落库到代码仓库，统一通过环境变量注入：
#   Windows PowerShell: $env:S3_ENDPOINT="https://s3.your-provider.com"; $env:S3_ACCESS_KEY="..."; $env:S3_SECRET_KEY="..."; $env:S3_BUCKET="..."
#   Linux/macOS:        export S3_ENDPOINT=... S3_ACCESS_KEY=... S3_SECRET_KEY=... S3_BUCKET=...
# 未配置时上传功能不可用，但不影响服务启动。
s3.endpoint=${S3_ENDPOINT:https://s3.example.com}
s3.access-key=${S3_ACCESS_KEY:please-set-s3-access-key}
s3.secret-key=${S3_SECRET_KEY:please-set-s3-secret-key}
s3.bucket=${S3_BUCKET:please-set-s3-bucket}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Config
jwt.secret=GuangGuQiHang2024SecretKeyForFreshmanServiceMustBe256Bits
jwt.expiration=86400000

# Swagger/Knife4j
knife4j.enable=true
knife4j.setting.language=zh_CN
